{% extends "base.html" %}
{% block title %}Login Administrativo | Imobiliária Marketplace{% endblock %}

{% block content %}
<main class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="auth-card p-4 p-lg-5 shadow-lg">
          <div class="text-center mb-4">
            <div class="auth-icon mb-3"><i class="bi bi-shield-lock"></i></div>
            <h1 class="h3 fw-bold mb-2">Área administrativa</h1>
            <p class="text-muted mb-0">Entre para gerenciar imóveis, usuários e logs.</p>
          </div>

          <form method="post" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control form-control-lg" name="email" placeholder="admin@imobiliaria.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control form-control-lg" name="senha" placeholder="Sua senha" required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">
              <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
            </button>
          </form>

          <div class="alert alert-info mt-4 mb-0 small">
            Primeiro acesso local: <strong>admin@imobiliaria.com</strong> / <strong>admin123</strong>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
